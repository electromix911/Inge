<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Mia 💙</title>

<style>

body{
    margin:0;
    padding:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffb6d9,#ffddee);
    font-family:Arial, sans-serif;
    overflow:hidden;
}

.card{
    background:white;
    width:90%;
    max-width:400px;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,0.2);
}

h1{
    color:#ff1493;
}

p{
    font-size:20px;
    color:#444;
}

button{
    padding:12px 20px;
    margin:10px;
    border:none;
    border-radius:30px;
    background:#ff1493;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
}

#mensaje{
    display:none;
    font-size:40px;
    color:#ff1493;
    margin-top:20px;
    font-weight:bold;
}

#foto{
    display:none;
    margin-top:20px;
}

#foto img{
    width:250px;
    border-radius:20px;
}

</style>
</head>

<body>

<div class="card">

<h1>💖 Para Mia 💖</h1>

<p>
Sé que eres complicada 😅<br><br>
pero créeme que puedo con eso futura inge jeje 🫠<br><br>
Espero poder salir contigo el domingo ✨
</p>

<button onclick="mostrarMensaje()">
Tekiero Mia 💖
</button>

<button onclick="mostrarFoto()">
Ver tu foto 📸
</button>

<div id="mensaje">
TE KIERO MIA 💖
</div>

<div id="foto">
<img src="mia.jpg">
</div>

</div>

<script>

function mostrarMensaje(){
    document.getElementById("mensaje").style.display="block";
}

function mostrarFoto(){
    document.getElementById("foto").style.display="block";
}

</script>

</body>
</html>
